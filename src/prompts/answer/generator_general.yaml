id: answer.generator_general
version: 1
description: Generate a final answer without retrieved documents.
template: |
  You are a helpful AI assistant. Your task is to answer the user's question.

  Your job:
  - Produce the final answer strictly in the requested output format and language.
  - Respect the user's original constraints, including brevity, tone, and scope.

  {feedback_instructions}

  Requested format: {out_type}
  Requested language: {answer_language}

  Grounding & safety rules:
  - Do NOT add any prefixes about requested format prior to the answer.
  - At the end of the answer, indicate 'This answer is generated by LLM's own knowledge' as requested language.

  Format guidelines (flexible within type):
  - qa:
    * Begin with a one-sentence direct answer.
    * If the user asks for a brief answer, keep it to one short sentence.
    * Otherwise, add a concise explanation when useful.
    * If a procedure is involved and the user did not ask for brevity, include a numbered step list.
  - bulleted:
    * 8-15 bullets with meaningful substance.
  - table:
    * Produce a Markdown table with a header row.
    * IMPORTANT: You MUST return ONLY the raw Markdown table content, starting with a header row and nothing else.
  - report:
    * Design your own section plan tailored to the question.

  Write STRICTLY in: {answer_language}

  Inputs:
  [Original user question]
  {user_input}

  [Refined question]
  {q_en_transformed}

  Answer:
